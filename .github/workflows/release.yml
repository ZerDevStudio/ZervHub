name: Build & Release ZervHub

on:
  push:
    tags:
      - 'v*.*.*'           # Triggers on version tags: v1.0.0, v2.4.3, etc.
  workflow_dispatch:        # Manual trigger for testing builds without a tag
    inputs:
      tag:
        description: 'Release tag (e.g. v2.5.5)'
        required: false
        default: 'v2.5.5'
      draft:
        description: 'Create as draft release'
        required: false
        default: 'false'

permissions:
  contents: write           # Required to create GitHub Releases and upload artifacts

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Windows Build (Tauri v2 + Rust)
  # ────────────────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build & Package (Windows Tauri NSIS)
        run: npm run dist:win

      - name: Prepare Release Artifacts & Bridge latest.yml
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist_release
          $inputTag = "${{ github.event.inputs.tag }}"
          $tag = if ($inputTag) { $inputTag } elseif ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF.Replace("refs/tags/", "") } else { "v2.5.5" }
          $version = $tag.TrimStart("v")
          
          # Find Tauri output NSIS installer
          $nsisInstaller = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $nsisInstaller) {
            Write-Error "NSIS installer was not found in src-tauri/target/release/bundle/nsis/"
            exit 1
          }
          
          $targetName = "ZervHub-Setup-$version.exe"
          $destination = Join-Path "dist_release" $targetName
          Copy-Item $nsisInstaller.FullName -Destination $destination

          # Also keep legacy ZenDev-Setup-$version.exe for backward compatibility
          $legacyName = "ZenDev-Setup-$version.exe"
          Copy-Item $nsisInstaller.FullName -Destination (Join-Path "dist_release" $legacyName)

          # Find standalone executable for Portable releases
          $standaloneBinary = Get-ChildItem -Path "src-tauri/target/release/*.exe" -Exclude "*.d" | Where-Object { $_.Name -notlike "*setup*" -and $_.Name -notlike "*installer*" -and $_.Name -notlike "*build*" } | Select-Object -First 1
          if ($standaloneBinary) {
            Copy-Item $standaloneBinary.FullName -Destination (Join-Path "dist_release" "ZenDev-Portable-$version.exe")
            Copy-Item $standaloneBinary.FullName -Destination (Join-Path "dist_release" "ZervHub-Portable-$version.exe")
          } else {
            Copy-Item $nsisInstaller.FullName -Destination (Join-Path "dist_release" "ZenDev-Portable-$version.exe")
            Copy-Item $nsisInstaller.FullName -Destination (Join-Path "dist_release" "ZervHub-Portable-$version.exe")
          }
          
          # Calculate SHA-512 for release manifests
          $hashBytes = (Get-FileHash -Path $destination -Algorithm SHA512).Hash.ToLower()
          $size = (Get-Item $destination).Length
          $releaseDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
          
          $lines = @(
            "version: $version",
            "files:",
            "  - url: $targetName",
            "    sha512: $hashBytes",
            "    size: $size",
            "path: $targetName",
            "sha512: $hashBytes",
            "releaseDate: '$releaseDate'"
          )
          [System.IO.File]::WriteAllLines("dist_release/latest.yml", $lines, [System.Text.Encoding]::UTF8)

          # Export environment variables for downstream actions
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Created dist_release/latest.yml, $targetName, $legacyName, ZenDev-Portable-$version.exe successfully."

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zervhub-windows-dist-${{ env.RELEASE_TAG }}
          path: dist_release/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ZervHub ${{ env.RELEASE_TAG }}
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: false
          generate_release_notes: true
          make_latest: true
          files: |
            dist_release/ZervHub-Setup-*.exe
            dist_release/ZenDev-Setup-*.exe
            dist_release/ZervHub-Portable-*.exe
            dist_release/ZenDev-Portable-*.exe
            dist_release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Public ZervHub-App Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        continue-on-error: true
        with:
          repository: ZerDevStudio/ZervHub-App
          tag_name: ${{ env.RELEASE_TAG }}
          name: ZervHub ${{ env.RELEASE_TAG }} — Official Desktop Release
          draft: false
          prerelease: false
          files: |
            dist_release/ZervHub-Setup-*.exe
            dist_release/ZenDev-Setup-*.exe
            dist_release/ZervHub-Portable-*.exe
            dist_release/ZenDev-Portable-*.exe
            dist_release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
